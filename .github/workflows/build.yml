name: Native C++ Build
on:
  push:
    branches:
      - dev/rebuild
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: "32"
            platform: Win32
            configuration: Release
          - folder: "64"
            platform: Win64
            configuration: Release
          - folder: "32"
            platform: Win32
            configuration: Debug
          - folder: "64"
            platform: Win64
            configuration: Debug
    steps:
      - uses: actions/checkout@v4
      - name: Discover MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
      - name: Build native Visual Studio project
        shell: cmd
        run: msbuild DisplayPilot.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /verbosity:minimal
      - name: Verify Visual Studio IDE solution configuration
        if: matrix.platform == 'Win64' && matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -version '[18.0,19.0)' -property installationPath
          $ide = Join-Path $vs "Common7\IDE\devenv.com"
          & $ide DisplayPilot.sln /Build "Debug|Win64" /Out "ide-build.log"
          $result = $LASTEXITCODE
          Get-Content "ide-build.log"
          if ($result -ne 0) { exit $result }
      - name: Verify standalone Windows executable
        shell: bash
        run: |
          test -s "dist/${{ matrix.folder }}/DisplayPilot.exe"
          if [[ "${{ matrix.configuration }}" == "Release" ]] && test -n "$(find "dist/${{ matrix.folder }}" -type f ! -name DisplayPilot.exe -print)"; then
            echo "Unexpected application deployment files" >&2
            exit 1
          fi
          echo "DisplayPilot.exe: $(wc -c < "dist/${{ matrix.folder }}/DisplayPilot.exe") bytes"
      - name: Smoke test application startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/${{ matrix.folder }}/DisplayPilot.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            $process.Refresh()
            if ($process.HasExited) {
              throw ("DisplayPilot exited during startup (code: 0x{0:X8})" -f ($process.ExitCode -band 0xffffffff))
            }
            Write-Host "DisplayPilot remained running after startup"
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Build native Inno Setup installer
        if: matrix.configuration == 'Release'
        shell: bash
        run: |
          compiler='/c/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if [[ ! -f "$compiler" ]]; then
            choco install innosetup --yes --no-progress
          fi
          test -f "$compiler"
          MSYS_NO_PATHCONV=1 "$compiler" installer/DisplayPilot.iss "/DAppArch=${{ matrix.folder }}"
          test -s "installers/${{ matrix.folder }}/DisplayPilot-Setup.exe"
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: DisplayPilot-Setup-${{ matrix.folder }}
          path: installers/${{ matrix.folder }}/DisplayPilot-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: DisplayPilot-${{ matrix.folder }}
          path: dist/${{ matrix.folder }}/DisplayPilot.exe
          if-no-files-found: error
