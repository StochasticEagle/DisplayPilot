name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
  push:
    branches:
      - master
      - development/**
    tags:
      - v*
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DisplayPilot.slnx

      - name: Validate full NuGet dependency graph
        run: |
          mkdir -p artifacts
          dotnet package list --project DisplayPilot.slnx --include-transitive --format json --no-restore > artifacts/dependency-graph.json
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          graph = json.loads(pathlib.Path("artifacts/dependency-graph.json").read_text(encoding="utf-8-sig"))
          assert graph.get("projects"), "No restored projects in dependency graph"

          package_props = ET.parse("Directory.Packages.props").getroot()
          central = {
              node.get("Include"): node.get("Version")
              for node in package_props.iter("PackageVersion")
          }
          explicit = {}
          for project in pathlib.Path("src").glob("*/*.csproj"):
              explicit[project.name] = {
                  node.get("Include")
                  for node in ET.parse(project).getroot().iter("PackageReference")
              }
          expected = {
              "DisplayPilot.App.csproj": {
                  "Microsoft.WindowsAppSDK.WinUI",
                  "Microsoft.WindowsAppSDK.Foundation",
                  "Microsoft.WindowsAppSDK.Runtime",
              },
              "DisplayPilot.Display.csproj": {"System.Management"},
              "DisplayPilot.Windows.csproj": set(),
              "DisplayPilot.Core.csproj": set(),
          }
          for project, expected_packages in expected.items():
              assert explicit.get(project) == expected_packages, (
                  f"{project} explicitly references {explicit.get(project)}; expected {expected_packages}"
              )
          assert "Microsoft.WindowsAppSDK.InteractiveExperiences" not in explicit["DisplayPilot.App.csproj"], (
              "InteractiveExperiences must remain transitive, never an explicit package reference"
          )
          assert central["Microsoft.WindowsAppSDK.InteractiveExperiences"] == "2.1.3"
          assert central["System.Management"] == "10.0.13"
          assert "WmiLight" not in central
          assert "WmiLight" not in explicit["DisplayPilot.Display.csproj"]
          assert all(
              name.startswith(("Microsoft.", "System.", "MSTest"))
              for name in central
          ), "Non-Microsoft package present in central dependency versions"

          apps = [project for project in graph["projects"]
                  if pathlib.PurePath(project.get("path", "").replace("\\", "/")).name == "DisplayPilot.App.csproj"]
          assert len(apps) == 1, "Missing DisplayPilot.App NuGet dependency graph"
          for framework in apps[0].get("frameworks", []):
              resolved = {
                  package["id"]: package.get("resolvedVersion")
                  for category in ("topLevelPackages", "transitivePackages")
                  for package in framework.get(category, [])
              }
              required = {
                  "Microsoft.WindowsAppSDK.WinUI": "2.3.0",
                  "Microsoft.WindowsAppSDK.Foundation": "2.3.5",
                  "Microsoft.WindowsAppSDK.Runtime": "2.3.1",
                  "Microsoft.WindowsAppSDK.InteractiveExperiences": "2.1.3",
              }
              required["System.Management"] = "10.0.13"
              assert "WmiLight" not in resolved, "Third-party WmiLight package must not be restored"
              for name, expected_version in required.items():
                  assert resolved.get(name) == expected_version, (
                      f"{name} resolved to {resolved.get(name)}, expected {expected_version}"
                  )
              print("DisplayPilot.App NuGet graph:", ", ".join(
                  f"{name}={version}" for name, version in sorted(resolved.items())
              ))
          print("Validated all direct project references and WinUI transitive dependencies")
          PY

      - name: Build
        run: dotnet build DisplayPilot.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DisplayPilot.slnx --configuration Release --no-build --logger trx

      - name: Publish Release Native AOT
        run: >-
          dotnet publish src/DisplayPilot.App/DisplayPilot.App.csproj
          --configuration Release
          --runtime win-x64
          --no-restore
          --output artifacts/DisplayPilot-win-x64

      - name: Publish Debug Native AOT
        run: >-
          dotnet publish src/DisplayPilot.App/DisplayPilot.App.csproj
          --configuration Debug
          --runtime win-x64
          --no-restore
          --output artifacts/DisplayPilot-debug-win-x64

      - name: Verify compiled XAML resource indexes
        run: |
          for mode in Debug Release; do
            if [[ "$mode" == Debug ]]; then
              output="artifacts/DisplayPilot-debug-win-x64"
            else
              output="artifacts/DisplayPilot-win-x64"
            fi
            if [[ ! -f "$output/resources.pri" ]]; then
              source=$(find "src/DisplayPilot.App/bin/$mode" -type f \
                \( -name 'resources.pri' -o -name 'DisplayPilot.pri' -o -name 'DisplayPilot.App.pri' \) \
                -print -quit)
              if [[ -z "$source" ]]; then
                echo "WinUI compiled resource index missing for $mode" >&2
                exit 1
              fi
              cp "$source" "$output/resources.pri"
            fi
            test -s "$output/resources.pri"
          done

      - name: Verify Debug and Release application outputs
        run: |
          for output in artifacts/DisplayPilot-debug-win-x64 artifacts/DisplayPilot-win-x64; do
            exe="$output/DisplayPilot.exe"
            test -f "$exe"
            bytes=$(wc -c < "$exe")
            if [[ "$output" == 'artifacts/DisplayPilot-win-x64' ]] && (( bytes >= 38797312 )); then
              echo "Release DisplayPilot.exe exceeds the 37 MB limit: $bytes bytes" >&2
              exit 1
            fi
            "./$exe" --verify-native-build
            forbidden=$(find "$output" -type f \( \
              -name 'DisplayPilot.runtimeconfig.json' -o \
              -name 'DisplayPilot.deps.json' -o \
              -name 'App.xbf' -o -name 'MainWindow.xbf' -o \
              -name 'coreclr.dll' -o -name 'hostfxr.dll' -o \
              -name 'Microsoft.ui.xaml.dll' \) -print)
            if [[ -n "$forbidden" ]]; then
              echo "Forbidden output files: $forbidden" >&2
              exit 1
            fi
          done
          release=artifacts/DisplayPilot-win-x64
          unwanted=$(find "$release" -type f \( \
            -iname '*.pdb' -o -name 'DirectML.dll' -o \
            -name 'Microsoft.ML.OnnxRuntime.dll' -o \
            -name 'Microsoft.Windows.AI.MachineLearning.dll' -o \
            -name 'onnxruntime.dll' -o -name 'WebView2Loader.dll' -o \
            -name 'Microsoft.Windows.AI.*' -o \
            -name 'Microsoft.Windows.Widgets.*' -o \
            -name 'Microsoft.Web.WebView2.*' \) -print)
          if [[ -n "$unwanted" ]]; then
            echo "Unexpected release payload: $unwanted" >&2
            exit 1
          fi
          if [[ -d "$release/Assets" ]]; then
            echo "Unexpected loose Assets directory in release" >&2
            exit 1
          fi
          tools=$(find "$release" -type f \( -iname '*dump*.exe' -o -iname '*.pdb' -o -iname '*.ilk' -o -iname '*.dbg' -o -iname '*.mui' -o -iname '*.resources.dll' \) -print)
          if [[ -n "$tools" ]]; then
            echo "Release includes debug tools, symbols, or localization: $tools" >&2
            exit 1
          fi
          for dir in "$release"/*/; do
            if [[ -d "$dir" ]] && [[ -z "$(find "$dir" -type f -print -quit)" ]]; then
              echo "Unexpected empty localization directory: $dir" >&2
              exit 1
            fi
          done

      - name: Download and validate runtime installers
        run: |
          mkdir -p artifacts/prerequisites
          curl.exe -fsSL --retry 3 \
            -o artifacts/prerequisites/WindowsAppRuntimeInstall-x64.exe \
            https://aka.ms/windowsappsdk/2.3/latest/windowsappruntimeinstall-x64.exe
          curl.exe -fsSL --retry 3 \
            -o artifacts/prerequisites/vc_redist.x64.exe \
            https://aka.ms/vs/17/release/vc_redist.x64.exe
          kitdir='/c/Program Files (x86)/Windows Kits/10/bin'
          signtool=$(find "$kitdir" -type f -path '*/x64/signtool.exe' \
            | sort -V | tail -n 1)
          if [[ -z "$signtool" ]]; then
            echo 'Windows SDK signtool.exe is required for signature verification' >&2
            exit 1
          fi
          for binary in artifacts/prerequisites/*.exe; do
            "$signtool" verify /pa "$binary"
          done

      - name: Install Inno Setup
        run: |
          compiler='/c/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if [[ ! -f "$compiler" ]]; then
            choco install innosetup --no-progress --yes
          fi
          test -f "$compiler"

      - name: Build installer
        run: |
          compiler='/c/Program Files (x86)/Inno Setup 6/ISCC.exe'
          "$compiler" installer/DisplayPilot.iss
          test -f artifacts/installer/DisplayPilot-Setup-win-x64.exe

      - name: Upload verification app
        uses: actions/upload-artifact@v7
        with:
          name: DisplayPilot-win-x64
          path: artifacts/DisplayPilot-win-x64
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: DisplayPilot-Setup-win-x64
          path: artifacts/installer/DisplayPilot-Setup-win-x64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: DisplayPilot-Setup-win-x64
          path: release

      - name: Create SHA-256 checksum
        shell: bash
        run: |
          cd release
          sha256sum DisplayPilot-Setup-win-x64.exe > DisplayPilot-Setup-win-x64.exe.sha256

      - name: Publish beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            target_arguments=(--verify-tag)
          else
            tag="v${REQUESTED_VERSION}"
            target_arguments=(--target "$GITHUB_SHA")
          fi
          version="${tag#v}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            release/DisplayPilot-Setup-win-x64.exe \
            release/DisplayPilot-Setup-win-x64.exe.sha256 \
            --generate-notes \
            --notes "Beta release. Windows 11 installer regression testing is complete; Windows 10 installer regression testing remains outstanding. See the README for supported features and current limitations." \
            --prerelease \
            --title "DisplayPilot ${version} beta" \
            "${target_arguments[@]}"
