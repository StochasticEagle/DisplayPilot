name: Native C++ Build
on:
  push:
    branches:
      - dev/rebuild
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "32"
            generator: Win32
          - arch: "64"
            generator: x64
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC native project
        shell: bash
        run: cmake -S . -B build/${{ matrix.arch }} -A ${{ matrix.generator }}
      - name: Compile Release
        shell: bash
        run: cmake --build build/${{ matrix.arch }} --config Release --parallel
      - name: Verify single executable
        shell: bash
        run: |
          test -s "dist/${{ matrix.arch }}/DisplayPilot.exe"
          if test -n "$(find "dist/${{ matrix.arch }}" -type f ! -name DisplayPilot.exe -print)"; then
            echo "Unexpected non-executable application file" >&2
            exit 1
          fi
          echo "DisplayPilot executable size: $(wc -c < "dist/${{ matrix.arch }}/DisplayPilot.exe") bytes"
      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: DisplayPilot-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/DisplayPilot.exe
          if-no-files-found: error
