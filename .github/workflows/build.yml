name: Native C++ Build
on:
  push:
    branches:
      - dev/rebuild
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: "32"
            platform: Win32
          - folder: "64"
            platform: x64
    steps:
      - uses: actions/checkout@v4
      - name: Discover MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Build native Visual Studio project
        shell: cmd
        run: msbuild DisplayPilot.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143 /verbosity:minimal
      - name: Verify standalone Windows executable
        shell: bash
        run: |
          test -s "dist/${{ matrix.folder }}/DisplayPilot.exe"
          if test -n "$(find "dist/${{ matrix.folder }}" -type f ! -name DisplayPilot.exe -print)"; then
            echo "Unexpected application deployment files" >&2
            exit 1
          fi
          echo "DisplayPilot.exe: $(wc -c < "dist/${{ matrix.folder }}/DisplayPilot.exe") bytes"
      - name: Build native Inno Setup installer
        shell: bash
        run: |
          compiler='/c/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if [[ ! -f "$compiler" ]]; then
            choco install innosetup --yes --no-progress
          fi
          test -f "$compiler"
          "$compiler" installer/DisplayPilot.iss "/dAppArch=${{ matrix.folder }}"
          test -s "installers/${{ matrix.folder }}/DisplayPilot-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayPilot-Setup-${{ matrix.folder }}
          path: installers/${{ matrix.folder }}/DisplayPilot-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayPilot-${{ matrix.folder }}
          path: dist/${{ matrix.folder }}/DisplayPilot.exe
          if-no-files-found: error
