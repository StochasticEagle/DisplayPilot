name: Native C++ Build
on:
  push:
    branches:
      - dev/rebuild
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: "32"
            platform: Win32
          - folder: "64"
            platform: x64
    steps:
      - uses: actions/checkout@v4
      - name: Build native Visual Studio project
        shell: cmd
        run: msbuild DisplayPilot.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143 /verbosity:minimal
      - name: Verify standalone Windows executable
        shell: bash
        run: |
          test -s "dist/${{ matrix.folder }}/DisplayPilot.exe"
          if test -n "$(find "dist/${{ matrix.folder }}" -type f ! -name DisplayPilot.exe -print)"; then
            echo "Unexpected application deployment files" >&2
            exit 1
          fi
          echo "DisplayPilot.exe: $(wc -c < "dist/${{ matrix.folder }}/DisplayPilot.exe") bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayPilot-${{ matrix.folder }}
          path: dist/${{ matrix.folder }}/DisplayPilot.exe
          if-no-files-found: error
