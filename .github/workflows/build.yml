name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
  push:
    branches:
      - master
      - development/**
    tags:
      - v*
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DisplayPilot.slnx

      - name: Build
        run: dotnet build DisplayPilot.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DisplayPilot.slnx --configuration Release --no-build --logger trx

      - name: Publish Debug Native AOT
        run: >-
          dotnet publish src/DisplayPilot.App/DisplayPilot.App.csproj
          --configuration Debug
          --runtime win-x64
          --no-restore
          --output artifacts/DisplayPilot-debug-win-x64

      - name: Publish Release Native AOT
        run: >-
          dotnet publish src/DisplayPilot.App/DisplayPilot.App.csproj
          --configuration Release
          --runtime win-x64
          --no-restore
          --output artifacts/DisplayPilot-win-x64

      - name: Verify compiled XAML resource indexes
        run: |
          for mode in Debug Release; do
            if [[ "$mode" == Debug ]]; then
              output="artifacts/DisplayPilot-debug-win-x64"
            else
              output="artifacts/DisplayPilot-win-x64"
            fi
            if [[ ! -f "$output/resources.pri" ]]; then
              source=$(find "src/DisplayPilot.App/bin/$mode" -type f \
                \( -name 'resources.pri' -o -name 'DisplayPilot.pri' -o -name 'DisplayPilot.App.pri' \) \
                -print -quit)
              if [[ -z "$source" ]]; then
                echo "WinUI compiled resource index missing for $mode" >&2
                exit 1
              fi
              cp "$source" "$output/resources.pri"
            fi
            test -s "$output/resources.pri"
          done

      - name: Verify Debug and Release application outputs
        run: |
          for output in artifacts/DisplayPilot-debug-win-x64 artifacts/DisplayPilot-win-x64; do
            exe="$output/DisplayPilot.exe"
            test -f "$exe"
            bytes=$(wc -c < "$exe")
            if (( bytes >= 38797312 )); then
              echo "DisplayPilot.exe exceeds the 37 MB limit: $bytes bytes" >&2
              exit 1
            fi
            "./$exe" --verify-native-build
            forbidden=$(find "$output" -type f \( \
              -name 'DisplayPilot.runtimeconfig.json' -o \
              -name 'DisplayPilot.deps.json' -o \
              -name 'App.xbf' -o -name 'MainWindow.xbf' -o \
              -name 'coreclr.dll' -o -name 'hostfxr.dll' -o \
              -name 'Microsoft.ui.xaml.dll' \) -print)
            if [[ -n "$forbidden" ]]; then
              echo "Forbidden output files: $forbidden" >&2
              exit 1
            fi
          done
          release=artifacts/DisplayPilot-win-x64
          unwanted=$(find "$release" -type f \( \
            -iname '*.pdb' -o -name 'DirectML.dll' -o \
            -name 'Microsoft.ML.OnnxRuntime.dll' -o \
            -name 'Microsoft.Windows.AI.MachineLearning.dll' -o \
            -name 'onnxruntime.dll' -o -name 'WebView2Loader.dll' -o \
            -name 'Microsoft.Windows.AI.*' -o \
            -name 'Microsoft.Windows.Widgets.*' -o \
            -name 'Microsoft.Web.WebView2.*' \) -print)
          if [[ -n "$unwanted" ]]; then
            echo "Unexpected release payload: $unwanted" >&2
            exit 1
          fi
          if [[ -d "$release/Assets" ]]; then
            echo "Unexpected loose Assets directory in release" >&2
            exit 1
          fi

      - name: Download and validate runtime installers
        run: |
          mkdir -p artifacts/prerequisites
          curl.exe -fsSL --retry 3 \
            -o artifacts/prerequisites/WindowsAppRuntimeInstall-x64.exe \
            https://aka.ms/windowsappsdk/2.3/latest/windowsappruntimeinstall-x64.exe
          curl.exe -fsSL --retry 3 \
            -o artifacts/prerequisites/vc_redist.x64.exe \
            https://aka.ms/vs/17/release/vc_redist.x64.exe
          kitdir='/c/Program Files (x86)/Windows Kits/10/bin'
          signtool=$(find "$kitdir" -type f -path '*/x64/signtool.exe' \
            | sort -V | tail -n 1)
          if [[ -z "$signtool" ]]; then
            echo 'Windows SDK signtool.exe is required for signature verification' >&2
            exit 1
          fi
          for binary in artifacts/prerequisites/*.exe; do
            "$signtool" verify /pa "$binary"
          done

      - name: Install Inno Setup
        run: |
          compiler='/c/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if [[ ! -f "$compiler" ]]; then
            choco install innosetup --no-progress --yes
          fi
          test -f "$compiler"

      - name: Build installer
        run: |
          compiler='/c/Program Files (x86)/Inno Setup 6/ISCC.exe'
          "$compiler" installer/DisplayPilot.iss
          test -f artifacts/installer/DisplayPilot-Setup-win-x64.exe

      - name: Upload verification app
        uses: actions/upload-artifact@v7
        with:
          name: DisplayPilot-win-x64
          path: artifacts/DisplayPilot-win-x64
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: DisplayPilot-Setup-win-x64
          path: artifacts/installer/DisplayPilot-Setup-win-x64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: DisplayPilot-Setup-win-x64
          path: release

      - name: Create SHA-256 checksum
        shell: bash
        run: |
          cd release
          sha256sum DisplayPilot-Setup-win-x64.exe > DisplayPilot-Setup-win-x64.exe.sha256

      - name: Publish beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            target_arguments=(--verify-tag)
          else
            tag="v${REQUESTED_VERSION}"
            target_arguments=(--target "$GITHUB_SHA")
          fi
          version="${tag#v}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            release/DisplayPilot-Setup-win-x64.exe \
            release/DisplayPilot-Setup-win-x64.exe.sha256 \
            --generate-notes \
            --notes "Beta release. Windows 11 installer regression testing is complete; Windows 10 installer regression testing remains outstanding. See the README for supported features and current limitations." \
            --prerelease \
            --title "DisplayPilot ${version} beta" \
            "${target_arguments[@]}"
